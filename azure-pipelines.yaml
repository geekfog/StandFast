# Build and test once, then let each environment's release stage provision its own infrastructure, build the image into that
# environment's registry, and deploy. Adding an environment is one more template block.
name: $(Date:yyyyMMdd)$(Rev:.r)

trigger:
  branches:
    include:
      - main
      - release/*

pr:
  branches:
    include:
      - main
      - release/*

variables:
  - group: standfast-vars
  - name: g_isStrPostMerge
    value: $[ne(variables['Build.Reason'], 'PullRequest')] # 'PullRequest' during validation (release stages skipped), 'IndividualCI' after merge (release stages run)
  - name: g_BuildConfiguration
    value: Release
  - name: g_VmImage
    value: ubuntu-latest
  - name: g_ImageRepository
    value: standfast-ui
  # Matches the Microsoft.App version infra/main.bicep declares, so a certificate read over the management API sees the resource the same way the deployment does.
  - name: g_ContainerAppsApiVersion
    value: '2025-07-01'

stages:
  - stage: Test
    displayName: Build and test
    jobs:
      - job: TestJob
        displayName: Restore, build and test
        pool:
          vmImage: $(g_VmImage)
        steps:
          - task: UseDotNet@2
            displayName: Install .NET SDK
            inputs:
              packageType: sdk
              useGlobalJson: true

          - task: DotNetCoreCLI@2
            displayName: Restore
            inputs:
              command: restore
              projects: StandFast.slnx

          - task: DotNetCoreCLI@2
            displayName: Build
            inputs:
              command: build
              projects: StandFast.slnx
              arguments: --configuration $(g_BuildConfiguration) --no-restore

          - task: DotNetCoreCLI@2
            displayName: Test
            inputs:
              command: test
              projects: tests/**/*.csproj
              arguments: --configuration $(g_BuildConfiguration) --no-build --collect:"XPlat Code Coverage"

  # The service connection name is a template parameter, not a variable group value: Azure DevOps resolves service connection
  # references while compiling the pipeline, before any variable group has been read.
  #
  # Which branches reach this environment is the a_AllowedBranches variable in standfast-prd-vars, not a condition here, so adding an
  # environment or changing what may release to one is a variable group edit rather than a pipeline change.
  - template: azure-pipelines-release.yaml
    parameters:
      p_publishEnvironment: PRD
      p_azureServiceConnection: StandFast-Azure
      p_dependsOn: Test
