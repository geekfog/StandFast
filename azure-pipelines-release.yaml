# Release stage template. Included once per environment by azure-pipelines.yaml; never run directly.
#
# Each environment is self-provisioning. The platform pass creates the registry and everything around it, the image is then built
# straight into that registry, and the app pass deploys it. That ordering is why no resource has to exist before the first run.
#
# Which branches may release to an environment is the environment's own business, so it is the a_AllowedBranches variable in that
# environment's group rather than anything in this file. Reading it needs a stage of its own: a stage's condition is evaluated before
# that stage's variables are expanded, so a group variable cannot gate the stage it is linked to. Gating from the stage in front also
# means the release stage is skipped outright rather than started and abandoned, so its Environment's approvals are never raised.
parameters:
  - name: p_publishEnvironment
    type: string
  - name: p_azureServiceConnection
    type: string
  - name: p_dependsOn
    type: string

stages:
  - stage: Gate_${{ parameters.p_publishEnvironment }}
    displayName: Gate ${{ parameters.p_publishEnvironment }}
    dependsOn: ${{ parameters.p_dependsOn }}
    # A pull request validates the merge rather than a branch, so it never releases whatever the environment allows. Build.Reason is a
    # predefined pipeline variable, which is why this one test can live in a stage condition when the branch list cannot.
    condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
    variables:
      - group: standfast-${{ lower(parameters.p_publishEnvironment) }}-vars
    jobs:
      - job: BranchGateJob
        displayName: Check the branch may release
        pool:
          vmImage: $(g_VmImage)
        steps:
          # Nothing here reads the repository, and skipping the checkout is most of this job's run time.
          - checkout: none

          - task: PowerShell@2
            name: BranchGate
            displayName: Evaluate a_AllowedBranches
            env:
              # Passed as environment variables rather than expanded into the script text, so a pattern containing a quote cannot break it.
              ALLOWED_BRANCHES: $(a_AllowedBranches)
              SOURCE_BRANCH: $(Build.SourceBranch)
              PUBLISH_ENVIRONMENT: ${{ parameters.p_publishEnvironment }}
            inputs:
              targetType: inline
              pwsh: true
              script: |
                $ErrorActionPreference = 'Stop'

                # Compared on the short name, so a pattern may be written either way round: 'release/*' and 'refs/heads/release/*' both work.
                $branch = $env:SOURCE_BRANCH -replace '^refs/heads/', ''
                $allowed = $env:ALLOWED_BRANCHES

                # A variable the group does not define arrives as its own unexpanded macro text, which means "not configured" exactly as empty does.
                # The marker is assembled rather than written out, because the agent expands macro syntax in this script too: spelled literally it
                # would become the variable's value and then match every configured value.
                $unsetMarker = '$' + '(a_AllowedBranches)'

                if ([string]::IsNullOrWhiteSpace($allowed) -or $allowed -eq $unsetMarker) {
                  Write-Host "a_AllowedBranches is not set for $env:PUBLISH_ENVIRONMENT, so any branch that triggers the pipeline may release."
                  Write-Host "##vso[task.setvariable variable=v_IsAllowedBranch;isOutput=true]true"
                  return
                }

                # Comma, semicolon or one per line, so the variable reads the same however it was typed into the group.
                $patterns = $allowed -split '[,;\r\n]' | ForEach-Object { $_.Trim() } | Where-Object { $_ }

                $isAllowed = $false
                foreach ($pattern in $patterns) {
                  # A trailing slash is shorthand for everything beneath a path, so 'release/' and 'release/*' mean the same thing.
                  $candidate = $pattern -replace '^refs/heads/', ''
                  if ($candidate.EndsWith('/')) {
                    $candidate += '*'
                  }

                  if ($branch -like $candidate) {
                    $isAllowed = $true
                    Write-Host "Branch '$branch' matches '$pattern', so $env:PUBLISH_ENVIRONMENT will be released."
                    break
                  }
                }

                if (-not $isAllowed) {
                  Write-Host "Branch '$branch' matches none of [$($patterns -join ', ')], so the $env:PUBLISH_ENVIRONMENT release stage is skipped."
                }

                Write-Host "##vso[task.setvariable variable=v_IsAllowedBranch;isOutput=true]$($isAllowed.ToString().ToLowerInvariant())"

  - stage: Release_${{ parameters.p_publishEnvironment }}
    displayName: Release ${{ parameters.p_publishEnvironment }}
    dependsOn: Gate_${{ parameters.p_publishEnvironment }}
    # A skipped gate leaves the output unset, which is not 'true', so a pull request stops here as well.
    condition: and(succeeded(), eq(dependencies.Gate_${{ parameters.p_publishEnvironment }}.outputs['BranchGateJob.BranchGate.v_IsAllowedBranch'], 'true'))
    variables:
      - group: standfast-${{ lower(parameters.p_publishEnvironment) }}-vars
    jobs:
      - deployment: DeployJob
        displayName: Deploy to ${{ parameters.p_publishEnvironment }}
        environment: StandFast ${{ parameters.p_publishEnvironment }}
        pool:
          vmImage: $(g_VmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                # A deployment job does not check out by default, and the image is built from this source tree.
                - checkout: self

                - task: AzureCLI@2
                  displayName: Compose deployment parameters
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $environmentCode = '${{ parameters.p_publishEnvironment }}'

                      # Resource group follows the same <AppBase><Env><Region>rg convention the Bicep uses for every other resource.
                      $resourceGroup = "$(a_AppBase)$environmentCode$(a_RegionToken)rg".ToLowerInvariant()

                      # Written once and reused by both deployment passes, so their inputs cannot drift apart.
                      $deploymentParameters = @{
                        contentVersion = '1.0.0.0'
                        parameters     = @{
                          p_AppBase           = @{ value = '$(a_AppBase)' }
                          p_Environment       = @{ value = $environmentCode }
                          p_RegionToken       = @{ value = '$(a_RegionToken)' }
                          p_Location          = @{ value = '$(a_Location)' }
                          p_OidcAuthority     = @{ value = '$(a_OidcAuthority)' }
                          p_OidcClientId      = @{ value = '$(a_OidcClientId)' }
                          p_OidcClientSecret  = @{ value = '$(a_OidcClientSecret)' }
                          p_DisplayTimeZoneId = @{ value = '$(a_DisplayTimeZoneId)' }
                          p_Tags              = @{ value = @{
                            Product     = '$(a_AppBase) Container App'
                            Environment = $environmentCode
                            CreatedBy   = 'Azure DevOps'
                          }}
                        }
                      }
                      $deploymentParameters.Add('$schema', 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#')
                      $deploymentParameters | ConvertTo-Json -Depth 6 | Set-Content '$(Pipeline.Workspace)/parameters.json'

                      az group create --name $resourceGroup --location '$(a_Location)' --output none
                      Write-Host "##vso[task.setvariable variable=v_ResourceGroup]$resourceGroup"

                - task: AzureCLI@2
                  displayName: Deploy platform resources
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'

                      # p_DeployApp=false stops at the platform, which is what brings the registry into existence before there is an image to push.
                      $outputs = az deployment group create `
                        --resource-group '$(v_ResourceGroup)' `
                        --template-file '$(Build.SourcesDirectory)/infra/main.bicep' `
                        --parameters '@$(Pipeline.Workspace)/parameters.json' p_DeployApp=false `
                        --query properties.outputs --output json | ConvertFrom-Json

                      Write-Host "##vso[task.setvariable variable=v_RegistryLoginServer]$($outputs.o_RegistryLoginServer.value)"

                - task: AzureCLI@2
                  displayName: Build and push image
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'

                      # az acr build builds inside the registry itself, so there is no Docker registry service connection and no local Docker daemon.
                      $registryName = '$(v_RegistryLoginServer)'.Split('.')[0]
                      az acr build `
                        --registry $registryName `
                        --image '$(g_ImageRepository):$(Build.BuildNumber)' `
                        --image '$(g_ImageRepository):latest' `
                        --file '$(Build.SourcesDirectory)/Dockerfile' `
                        '$(Build.SourcesDirectory)' --output none

                - task: AzureCLI@2
                  displayName: Deploy container app
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $image = "$(v_RegistryLoginServer)/$(g_ImageRepository):$(Build.BuildNumber)"

                      $outputs = az deployment group create `
                        --resource-group '$(v_ResourceGroup)' `
                        --template-file '$(Build.SourcesDirectory)/infra/main.bicep' `
                        --parameters '@$(Pipeline.Workspace)/parameters.json' p_DeployApp=true p_ContainerImage=$image `
                        --query properties.outputs --output json | ConvertFrom-Json

                      $applicationUrl = $outputs.o_ApplicationUrl.value
                      Write-Host "StandFast ${{ parameters.p_publishEnvironment }} is available at $applicationUrl"
                      Write-Host "Allowed callback URL:        $applicationUrl/signin-oidc"
                      Write-Host "Allowed logout redirect URL: $applicationUrl/signout-callback-oidc"
