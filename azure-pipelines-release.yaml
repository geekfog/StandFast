# Release stage template. Included once per environment by azure-pipelines.yaml; never run directly.
#
# Each environment is self-provisioning. The platform pass creates the registry and everything around it, the image is then built
# straight into that registry, and the app pass deploys it. That ordering is why no resource has to exist before the first run.
#
# Which branches may release to an environment is the environment's own business, so it is the a_AllowedBranches variable in that
# environment's group rather than anything in this file.
parameters:
  - name: p_publishEnvironment
    type: string
  - name: p_azureServiceConnection
    type: string
  - name: p_dependsOn
    type: string

stages:
  - stage: Release_${{ parameters.p_publishEnvironment }}
    displayName: Release ${{ parameters.p_publishEnvironment }}
    dependsOn: ${{ parameters.p_dependsOn }}
    # a_AllowedBranches is a pipe-delimited list of the branches that may release here, written without the refs/heads/ prefix, for
    # example "main|release/1.2". An undefined or empty variable reads as an empty string, which allows every branch.
    condition: >-
      and(succeeded(),
          or(eq(variables['a_AllowedBranches'], ''),
             containsValue(split(variables['a_AllowedBranches'], '|'), replace(variables['Build.SourceBranch'], 'refs/heads/', ''))))
    variables:
      - group: standfast-${{ lower(parameters.p_publishEnvironment) }}-vars
    jobs:
      - deployment: DeployJob
        displayName: Deploy to ${{ parameters.p_publishEnvironment }}
        environment: StandFast ${{ parameters.p_publishEnvironment }}
        pool:
          vmImage: $(g_VmImage)
        strategy:
          runOnce:
            deploy:
              steps:
                # A deployment job does not check out by default, and the image is built from this source tree.
                - checkout: self

                - task: AzureCLI@2
                  displayName: Compose deployment parameters
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $environmentCode = '${{ parameters.p_publishEnvironment }}'

                      # Resource group follows the same <AppBase><Env><Region>rg convention the Bicep uses for every other resource. The braces
                      # around environmentCode are load bearing: the agent expands the macros first, leaving the PowerShell variable butted up
                      # against the region token, and PowerShell would otherwise read the whole run-on as one undefined variable name.
                      $resourceGroup = "$(a_AppBase)${environmentCode}$(a_RegionToken)rg".ToLowerInvariant()

                      # Written once and reused by both deployment passes, so their inputs cannot drift apart.
                      $deploymentParameters = @{
                        contentVersion = '1.0.0.0'
                        parameters     = @{
                          p_AppBase           = @{ value = '$(a_AppBase)' }
                          p_Environment       = @{ value = $environmentCode }
                          p_RegionToken       = @{ value = '$(a_RegionToken)' }
                          p_Location          = @{ value = '$(a_Location)' }
                          p_OidcAuthority     = @{ value = '$(a_OidcAuthority)' }
                          p_OidcClientId      = @{ value = '$(a_OidcClientId)' }
                          p_OidcClientSecret  = @{ value = '$(a_OidcClientSecret)' }
                          p_DisplayTimeZoneId = @{ value = '$(a_DisplayTimeZoneId)' }
                          p_CustomDomain      = @{ value = '$(a_CustomDomain)' }
                          p_Tags              = @{ value = @{
                            Product     = '$(a_AppBase) Container App'
                            Environment = $environmentCode
                            CreatedBy   = 'Azure DevOps'
                          }}
                        }
                      }
                      $deploymentParameters.Add('$schema', 'https://schema.management.azure.com/schemas/2019-04-01/deploymentParameters.json#')
                      $deploymentParameters | ConvertTo-Json -Depth 6 | Set-Content '$(Pipeline.Workspace)/parameters.json'

                      az group create --name $resourceGroup --location '$(a_Location)' --output none
                      Write-Host "##vso[task.setvariable variable=v_ResourceGroup]$resourceGroup"

                - task: AzureCLI@2
                  displayName: Deploy platform resources
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'

                      # p_DeployApp=false stops at the platform, which is what brings the registry into existence before there is an image to push.
                      $outputs = az deployment group create `
                        --resource-group '$(v_ResourceGroup)' `
                        --template-file '$(Build.SourcesDirectory)/infra/main.bicep' `
                        --parameters '@$(Pipeline.Workspace)/parameters.json' p_DeployApp=false `
                        --query properties.outputs --output json | ConvertFrom-Json

                      Write-Host "##vso[task.setvariable variable=v_RegistryLoginServer]$($outputs.o_RegistryLoginServer.value)"
                      Write-Host "##vso[task.setvariable variable=v_EnvironmentName]$($outputs.o_EnvironmentName.value)"

                - task: AzureCLI@2
                  displayName: Build and push image
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'

                      # az acr build builds inside the registry itself, so there is no Docker registry service connection and no local Docker daemon.
                      $registryName = '$(v_RegistryLoginServer)'.Split('.')[0]
                      az acr build `
                        --registry $registryName `
                        --image '$(g_ImageRepository):$(Build.BuildNumber)' `
                        --image '$(g_ImageRepository):latest' `
                        --file '$(Build.SourcesDirectory)/Dockerfile' `
                        '$(Build.SourcesDirectory)' --output none

                - task: AzureCLI@2
                  displayName: Deploy container app
                  inputs:
                    azureSubscription: ${{ parameters.p_azureServiceConnection }}
                    scriptType: pscore
                    scriptLocation: inlineScript
                    inlineScript: |
                      $ErrorActionPreference = 'Stop'
                      $image = "$(v_RegistryLoginServer)/$(g_ImageRepository):$(Build.BuildNumber)"

                      function Invoke-AppDeployment {
                        param([string[]] $p_Parameters = @())

                        $result = az deployment group create `
                          --resource-group '$(v_ResourceGroup)' `
                          --template-file '$(Build.SourcesDirectory)/infra/main.bicep' `
                          --parameters '@$(Pipeline.Workspace)/parameters.json' p_DeployApp=true p_ContainerImage=$image @p_Parameters `
                          --query properties.outputs --output json

                        if ($LASTEXITCODE -ne 0) {
                          throw 'The container app deployment failed.'
                        }

                        return $result | ConvertFrom-Json
                      }

                      # The certificate an environment already holds for the domain is the one the app binds, so a release neither reissues it nor leaves a second certificate behind.
                      # Both collections are read because an uploaded certificate and a managed one live apart, and over the management API because az containerapp is an extension the
                      # agent does not carry.
                      $certificateId = ''
                      if ('$(a_CustomDomain)') {
                        $subscriptionId = az account show --query id --output tsv
                        $environmentUrl = "https://management.azure.com/subscriptions/$subscriptionId/resourceGroups/$(v_ResourceGroup)/providers/Microsoft.App/managedEnvironments/$(v_EnvironmentName)"

                        $certificateId = [string](@('managedCertificates', 'certificates') |
                          ForEach-Object { (az rest --method get --url ($environmentUrl + '/' + $_ + '?api-version=$(g_ContainerAppsApiVersion)') --output json | ConvertFrom-Json).value } |
                          Where-Object { $_.properties.subjectName -eq '$(a_CustomDomain)' -and $_.properties.provisioningState -eq 'Succeeded' } |
                          Select-Object -First 1 -ExpandProperty id)
                      }

                      if ('$(a_CustomDomain)' -and -not $certificateId) {
                        # Azure issues a managed certificate only for a hostname an app in the environment already carries, so the domain is bound without a certificate first and the
                        # certificate is issued and bound on the pass after it.
                        Write-Host "No certificate covers $(a_CustomDomain) yet; binding the domain, then issuing one"
                        Invoke-AppDeployment | Out-Null
                        $outputs = Invoke-AppDeployment @('p_IssueCustomDomainCertificate=true')
                      }
                      else {
                        if ($certificateId) {
                          Write-Host "Binding $(a_CustomDomain) to the certificate the environment already holds: $certificateId"
                        }

                        $outputs = Invoke-AppDeployment @("p_CustomDomainCertificateId=$certificateId")
                      }

                      $applicationUrl = $outputs.o_ApplicationUrl.value
                      Write-Host "StandFast ${{ parameters.p_publishEnvironment }} is available at $applicationUrl"
                      Write-Host "Allowed callback URL:        $applicationUrl/signin-oidc"
                      Write-Host "Allowed logout redirect URL: $applicationUrl/signout-callback-oidc"
                      Write-Host "Domain verification id:      $($outputs.o_CustomDomainVerificationId.value)"
